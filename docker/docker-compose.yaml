#
# Terasology, rendered in software and served to a browser.
#
# Meant to be deployed by Coolify: it attaches its own proxy network and generates the Traefik
# labels from the SERVICE_FQDN_ variable below, so no host port is published and nothing is
# reachable except through the proxy.
#
# Coolify must clone this repository with its submodules: the modules live in modules/ as
# submodules, and without them there is no world generator to run.

services:
  terasology:
    build:
      # Both of these are relative to the *project directory*, not to this file. Coolify passes
      # --project-directory <repo root>, so they are written from the repository root, which is
      # also where the build has to look: it needs gradlew, the engine and the modules.
      #
      # A local build therefore has to say where the root is, or Compose takes the directory of
      # this file and everything shifts one level:
      #     docker compose --project-directory . -f docker/docker-compose.yaml build
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped

    environment:
      # Coolify generates the domain and the Traefik labels from this one, on the container's 6080.
      - SERVICE_FQDN_TERASOLOGY_6080
      # And generates this password once, then keeps it. The entrypoint refuses to start without it.
      - VNC_PASSWORD=${SERVICE_PASSWORD_VNC}
      # Software rendering: give it the cores, it has nothing else.
      - SCREEN=${SCREEN:-1600x900x24}
      - LP_NUM_THREADS=${LP_NUM_THREADS:-8}
      - WORLD_GENERATOR=${WORLD_GENERATOR:-CubeWorlds:cubeworld}
      - GAME_ARGS=${GAME_ARGS:-}

    # No expose and no ports: the proxy reaches the container over the network it shares with it,
    # and the port it should aim at is the one named in SERVICE_FQDN_TERASOLOGY_6080.

    labels:
      # Coolify reads this label and merges its contents into the middleware list of the router it
      # generates, so nothing here has to name that router. Naming it would mean carrying the
      # resource's uuid in the file, and a label pointing at a router that no longer exists is
      # ignored in silence — an authentication gate that fails by opening.
      #
      # The middleware itself is defined by the Authelia stack, which is what the @docker suffix
      # says: Traefik prefixes a middleware with the provider that handed it over.
      #
      # Order matters on first deployment: Traefik rejects a router that references a middleware it
      # does not know, so deploy Authelia before this. That failure is at least the safe way round.
      - coolify.traefik.middlewares=authelia@docker

    volumes:
      # The source tree is not mounted: it is baked into the image. Coolify converts a relative
      # bind into a named volume, so `.:/work` produced an empty one and the game found no gradlew.
      #
      # Around three gigabytes of dependencies. Losing this on every deploy would be painful.
      - gradle-cache:/home/game/.gradle
      # Saves, config and screenshots.
      - game-home:/home/game/terasology

    # Xvfb and llvmpipe both want room; the JVM is capped by the engine's own settings.
    shm_size: "512mb"
    mem_limit: ${MEM_LIMIT:-8g}
    cpus: ${CPUS:-8}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6080/vnc.html"]
      interval: 30s
      timeout: 5s
      # Gradle resolves its dependencies on a cold cache before the display is ever served.
      start_period: 600s
      retries: 5

volumes:
  gradle-cache:
  game-home:
